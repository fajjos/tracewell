[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracewell"
version = "0.1.0"
description = "Python SDK for Tracewell AI agent observability."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.28.1",
  "pydantic>=2.11.7",
]

[tool.setuptools.packages.find]
where = ["src"]
